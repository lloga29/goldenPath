apiVersion: apps/v1
kind: Deployment
metadata:
  name: goldenpath-runtime
  labels:
    app.kubernetes.io/name: goldenpath-runtime
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: goldenpath-runtime-lab
    app.kubernetes.io/managed-by: argocd
    team: platform
    environment: ephemeral
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goldenpath-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goldenpath-runtime
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: goldenpath-runtime-lab
        app.kubernetes.io/managed-by: argocd
        team: platform
        environment: ephemeral
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goldenpath-runtime
          image: goldenpath-runtime/reference:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

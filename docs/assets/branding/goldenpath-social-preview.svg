  </g>
  <rect x="70" y="72" width="1140" height="496" rx="28" fill="#111d35" stroke="#273a5e" stroke-width="2"/>
  <rect x="70" y="72" width="14" height="496" fill="#f6c453"/>
  <text x="125" y="190" fill="#f7f9fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="800">GoldenPath</text>
  <text x="127" y="260" fill="#f6c453" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">Evidence-backed platform engineering</text>
  <text x="127" y="330" fill="#aebbd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28">Kubernetes  ·  GitOps  ·  Terraform  ·  Policy as Code</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">GoldenPath social preview</title>
  <desc id="desc">GoldenPath evidence-backed platform engineering with R0-R4, fail-closed, digest-bound, and proof-scoped assurance.</desc>
  <rect width="1280" height="640" fill="#08101f"/>
  <g stroke="#0d192e" stroke-width="1">

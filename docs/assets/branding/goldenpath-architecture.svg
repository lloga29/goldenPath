<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">GoldenPath delivery architecture</title>
  <desc id="desc">GoldenPath connects developer self-service, CI and policy gates, risk-adaptive assurance, immutable artifacts, GitOps reconciliation, Kubernetes runtime, and observability while keeping repository, runtime, and production evidence distinct.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="1" stop-color="#17223b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#f49a3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8ba3c7"/>
    </marker>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .subtitle{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b8c4d8}
      .boxTitle{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .boxText{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c9d4e5}
      .chip{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#101827}
      .footer{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d7dfec}
      .arrow{stroke:#8ba3c7;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .card{fill:#111c31;stroke:#2b3d5f;stroke-width:2}
      .cardAccent{fill:#152440;stroke:#f4b84a;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <text x="80" y="86" class="title">From source code to evidence-backed production</text>
  <text x="80" y="124" class="subtitle">A paved road that makes secure delivery explicit, reviewable, and measurable.</text>

  <g transform="translate(80 172)">
    <rect width="190" height="44" rx="22" fill="url(#accent)"/>
    <text x="95" y="28" text-anchor="middle" class="chip">R0-R4 assurance</text>
    <rect x="206" width="118" height="44" rx="22" fill="#dbeafe"/>
    <text x="265" y="28" text-anchor="middle" class="chip">SBOM</text>
    <rect x="340" width="174" height="44" rx="22" fill="#d1fae5"/>
    <text x="427" y="28" text-anchor="middle" class="chip">SLSA provenance</text>
    <rect x="530" width="128" height="44" rx="22" fill="#ede9fe"/>
    <text x="594" y="28" text-anchor="middle" class="chip">Cosign</text>
    <rect x="674" width="166" height="44" rx="22" fill="#fee2e2"/>
    <text x="757" y="28" text-anchor="middle" class="chip">Policy as Code</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="284" width="205" height="164" rx="20" class="card"/>
    <text x="104" y="322" class="boxTitle">Developer</text>
    <text x="104" y="354" class="boxText">Self-service</text>
    <text x="104" y="379" class="boxText">Golden template</text>
    <text x="104" y="404" class="boxText">Pull request</text>

    <rect x="334" y="284" width="225" height="164" rx="20" class="cardAccent"/>
    <text x="358" y="322" class="boxTitle">CI + guardrails</text>
    <text x="358" y="354" class="boxText">Validation</text>
    <text x="358" y="379" class="boxText">Policy gates</text>
    <text x="358" y="404" class="boxText">Evidence manifest</text>

    <rect x="608" y="284" width="225" height="164" rx="20" class="cardAccent"/>
    <text x="632" y="322" class="boxTitle">Trusted artifact</text>
    <text x="632" y="354" class="boxText">Immutable digest</text>
    <text x="632" y="379" class="boxText">SBOM + provenance</text>
    <text x="632" y="404" class="boxText">Signature verification</text>

    <rect x="882" y="284" width="225" height="164" rx="20" class="card"/>
    <text x="906" y="322" class="boxTitle">GitOps desired state</text>
    <text x="906" y="354" class="boxText">Promotion PR</text>
    <text x="906" y="379" class="boxText">Argo CD</text>
    <text x="906" y="404" class="boxText">Reviewable change</text>

    <rect x="1156" y="284" width="265" height="164" rx="20" class="card"/>
    <text x="1180" y="322" class="boxTitle">Kubernetes runtime</text>
    <text x="1180" y="354" class="boxText">Dev / staging / prod</text>
    <text x="1180" y="379" class="boxText">Gateway + policies</text>
    <text x="1180" y="404" class="boxText">Observable workloads</text>
  </g>

  <path d="M285 366 H324" class="arrow"/>
  <path d="M559 366 H598" class="arrow"/>
  <path d="M833 366 H872" class="arrow"/>
  <path d="M1107 366 H1146" class="arrow"/>

  <g transform="translate(80 510)">
    <rect width="1340" height="112" rx="20" fill="#0d1729" stroke="#2b3d5f" stroke-width="2"/>
    <text x="28" y="42" class="boxTitle">Evidence boundary</text>
    <text x="28" y="76" class="footer">Repository/reference evidence</text>
    <text x="335" y="76" class="footer">→</text>
    <text x="382" y="76" class="footer">Runtime evidence</text>
    <text x="600" y="76" class="footer">→</text>
    <text x="647" y="76" class="footer">Production validation</text>
    <text x="950" y="76" class="boxText">Each level requires its own proof.</text>
  </g>

  <text x="80" y="674" class="subtitle">GoldenPath · Platform Engineering · GitOps · Kubernetes · Terraform · OPA</text>
</svg>
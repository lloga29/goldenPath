# Copier configuration for the Go HTTP service paved-road template.
_min_copier_version: "9.0.0"

_envops:
  autoescape: false
  keep_trailing_newline: true

project_name:
  type: str
  help: "Service name (lowercase letters, numbers, and hyphens)"
  validator: "{% if not project_name | regex_search('^[a-z][a-z0-9-]{2,28}[a-z0-9]$') %}Invalid name: use 4-30 lowercase alphanumeric characters or hyphens and start with a letter.{% endif %}"

github_owner:
  type: str
  help: "GitHub organization or account that will own the generated repository"
  validator: "{% if not github_owner | regex_search('^[A-Za-z0-9][A-Za-z0-9-]{0,38}$') %}Invalid GitHub owner name.{% endif %}"

team:
  type: str
  help: "Owning team name without the team- prefix"
  validator: "{% if not team | regex_search('^[a-z][a-z0-9-]{1,30}$') %}Invalid team name: use lowercase letters, numbers, and hyphens.{% endif %}"

description:
  type: str
  help: "Short service description"

port:
  type: int
  default: 8080
  help: "HTTP listen port"
  validator: "{% if port < 1 or port > 65535 %}Port must be between 1 and 65535.{% endif %}"

owner_email:
  type: str
  help: "Owning team email for operational escalation"
  validator: "{% if not owner_email | regex_search('^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$') %}Owner must be a valid email address.{% endif %}"

go_version:
  type: str
  default: "1.26"
  choices:
    - "1.25"
    - "1.26"
  help: "Go language version"

_tasks:
  - "go mod tidy"

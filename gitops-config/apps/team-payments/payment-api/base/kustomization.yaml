apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - servicemonitor.yaml

# Preserve the selector/template behavior of the former commonLabels field.
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
      team: payments
    includeSelectors: true

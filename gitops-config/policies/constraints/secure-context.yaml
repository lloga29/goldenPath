# Enforce non-root execution and disabled privilege escalation at admission time.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sSecureContext
metadata:
  name: require-secure-container-context
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  match:
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]

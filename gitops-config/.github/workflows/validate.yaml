# Validation blueprint for a standalone GitOps repository.
name: Validate Manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Validate Kustomize builds
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            echo "Validating Kustomize build: $dir"
            kustomize build "$dir" >/dev/null
          done < <(find gitops-config -name kustomization.yaml -exec dirname {} \; | sort -u)

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          while IFS= read -r file; do
            echo "Checking YAML: $file"
            python3 - "$file" <<'PY'
          import sys
          import yaml
          with open(sys.argv[1], encoding="utf-8") as handle:
              list(yaml.safe_load_all(handle))
          PY
          done < <(find gitops-config -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)

      - name: Validate rendered Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kubeval.tar.gz https://github.com/instrumenta/kubeval/releases/download/v0.16.1/kubeval-linux-amd64.tar.gz
          tar -xzf kubeval.tar.gz
          sudo install -m 0755 kubeval /usr/local/bin/kubeval

          while IFS= read -r dir; do
            echo "Schema-validating rendered manifests: $dir"
            kustomize build "$dir" | kubeval --strict --ignore-missing-schemas
          done < <(find gitops-config/apps gitops-config/platform gitops-config/policies -name kustomization.yaml -exec dirname {} \; | sort -u)

      - name: Setup Conftest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz
          sudo install -m 0755 conftest /usr/local/bin/conftest

      - name: Resolve policy bundle
        id: policies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d platform-policies/kubernetes ]]; then
            echo "root=platform-policies" >> "$GITHUB_OUTPUT"
          elif [[ -d ../platform-policies/kubernetes ]]; then
            echo "root=../platform-policies" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: platform-policies policy bundle was not found." >&2
            exit 1
          fi

      - name: Validate policy exception registry
        shell: bash
        run: |
          set -euo pipefail
          POLICY_ROOT="${{ steps.policies.outputs.root }}"
          python3 "$POLICY_ROOT/scripts/validate-exceptions.py" "$POLICY_ROOT/policy-exceptions.yaml"

      - name: Run policy fixtures
        shell: bash
        run: |
          set -euo pipefail
          POLICY_ROOT="${{ steps.policies.outputs.root }}"
          "$POLICY_ROOT/scripts/test-policies.sh"

      - name: Run policies against rendered application overlays
        shell: bash
        run: |
          set -euo pipefail
          POLICY_ROOT="${{ steps.policies.outputs.root }}"
          found=false
          while IFS= read -r dir; do
            found=true
            echo "Policy-validating rendered overlay: $dir"
            rendered=$(mktemp)
            kustomize build "$dir" > "$rendered"
            conftest test "$rendered" --policy "$POLICY_ROOT/kubernetes"
            rm -f "$rendered"
          done < <(find gitops-config/apps -path '*/overlays/*/kustomization.yaml' -exec dirname {} \; | sort -u)

          [[ "$found" == "true" ]] || {
            echo "ERROR: no application overlays were found for policy validation." >&2
            exit 1
          }

# Validación de manifiestos GitOps

name: Validate Manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Validate Kustomize builds
        run: |
          find . -name "kustomization.yaml" -exec dirname {} \; | while read dir; do
            echo "Validating: $dir"
            kustomize build "$dir" > /dev/null || exit 1
          done

      - name: Validate YAML syntax
        run: |
          find . -name "*.yaml" -o -name "*.yml" | while read file; do
            echo "Checking: $file"
            python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done

      - name: Kubeval validation
        run: |
          wget -q https://github.com/instrumenta/kubeval/releases/download/v0.16.1/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

          find apps platform -name "*.yaml" | while read file; do
            kubeval --strict --ignore-missing-schemas "$file" || true
          done

      - name: Policy check (Conftest)
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.45.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

          if [ -d "policies" ]; then
            find apps -name "deployment.yaml" | xargs conftest test --policy policies/ || true
          fi

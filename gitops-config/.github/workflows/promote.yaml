# Manual promotion blueprint. The promotion script is the single implementation
# of the promotion rules and enforces the required Git commit identity.
name: Promote Version

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service name'
        required: true
        type: string
      team:
        description: 'Owning team without the team- prefix'
        required: true
        type: string
      from_env:
        description: 'Source environment'
        required: true
        type: choice
        options:
          - dev
          - staging
      to_env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
      image_tag:
        description: 'Immutable image tag already running in the source environment'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure required Git identity
        shell: bash
        run: |
          git config user.name "Juan Gallo"
          git config user.email "lloga29@gmail.com"

      - name: Promote immutable image and open pull request
        shell: bash
        env:
          AUTO_PR: 'true'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./gitops-config/scripts/promote.sh \
            "${{ inputs.team }}" \
            "${{ inputs.service }}" \
            "${{ inputs.from_env }}" \
            "${{ inputs.to_env }}" \
            "${{ inputs.image_tag }}"

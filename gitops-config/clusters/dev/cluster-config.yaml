# Development cluster reference configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: kube-system
data:
  environment: dev
  cluster-name: dev-cluster
  region: us-east-1
  log-level: debug

  # Default resource guidance.
  default-cpu-request: "100m"
  default-memory-request: "128Mi"
  default-cpu-limit: "500m"
  default-memory-limit: "512Mi"

  # Autoscaling guidance.
  hpa-min-replicas: "1"
  hpa-max-replicas: "5"

  # Platform service endpoints.
  prometheus-url: http://prometheus.observability:9090
  loki-url: http://loki.observability:3100
  tempo-url: http://tempo.observability:4317

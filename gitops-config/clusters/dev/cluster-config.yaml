# Configuración del cluster de desarrollo
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: kube-system
data:
  environment: dev
  cluster-name: dev-cluster
  region: us-east-1
  log-level: debug
  
  # Configuración de recursos por defecto
  default-cpu-request: "100m"
  default-memory-request: "128Mi"
  default-cpu-limit: "500m"
  default-memory-limit: "512Mi"
  
  # Configuración de auto-scaling
  hpa-min-replicas: "1"
  hpa-max-replicas: "5"
  
  # URLs de servicios
  prometheus-url: http://prometheus.observability:9090
  loki-url: http://loki.observability:3100
  tempo-url: http://tempo.observability:4317

# Production cluster reference configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: kube-system
data:
  environment: prod
  cluster-name: prod-cluster
  region: us-east-1
  log-level: info

  # Higher default resource guidance for production workloads.
  default-cpu-request: "200m"
  default-memory-request: "256Mi"
  default-cpu-limit: "1000m"
  default-memory-limit: "1Gi"

  # Autoscaling guidance.
  hpa-min-replicas: "2"
  hpa-max-replicas: "20"

  # Platform service endpoints.
  prometheus-url: http://prometheus.observability:9090
  loki-url: http://loki.observability:3100
  tempo-url: http://tempo.observability:4317

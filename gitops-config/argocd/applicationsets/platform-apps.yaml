# ApplicationSet for shared platform components.
# Production reconciliation requires an explicit manual sync.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - list:
        elements:
          - env: dev
            cluster: https://dev-cluster.example.com
            autoSync: true
            prune: true
          - env: staging
            cluster: https://staging-cluster.example.com
            autoSync: true
            prune: false
          - env: prod
            cluster: https://prod-cluster.example.com
            autoSync: false
            prune: false

  template:
    metadata:
      name: 'platform-{{.env}}'
      labels:
        component: platform
        environment: '{{.env}}'

    spec:
      project: platform

      source:
        repoURL: git@github.com:org/gitops-config.git
        targetRevision: HEAD
        path: 'platform/overlays/{{.env}}'

      destination:
        server: '{{.cluster}}'
        namespace: platform

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune }}
          selfHeal: true
    {{- end }}

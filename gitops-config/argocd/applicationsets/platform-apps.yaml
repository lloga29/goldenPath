# Argo CD ApplicationSet for shared platform Helm add-ons.
# Argo CD is the only Kubernetes reconciliation engine in the Golden Path baseline.
# Development and staging reconcile automatically; production requires an explicit sync.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          - list:
              elements:
                - component: cert-manager
                  release: cert-manager
                  chart: cert-manager
                  repo: quay.io/jetstack/charts
                  version: v1.21.2
                  namespace: cert-manager
                - component: external-secrets
                  release: external-secrets
                  chart: external-secrets
                  repo: https://charts.external-secrets.io
                  version: 2.10.0
                  namespace: external-secrets
                - component: kube-prometheus-stack
                  release: kube-prometheus-stack
                  chart: kube-prometheus-stack
                  repo: https://prometheus-community.github.io/helm-charts
                  version: 91.4.1
                  namespace: observability
                - component: loki
                  release: loki
                  chart: loki
                  repo: https://grafana-community.github.io/helm-charts
                  version: 18.13.1
                  namespace: observability
                - component: tempo
                  release: tempo
                  chart: tempo
                  repo: https://grafana-community.github.io/helm-charts
                  version: 3.0.0
                  namespace: observability
                - component: gatekeeper
                  release: gatekeeper
                  chart: gatekeeper
                  repo: https://open-policy-agent.github.io/gatekeeper/charts
                  version: 3.14.0
                  namespace: gatekeeper-system
                - component: envoy-gateway
                  release: eg
                  chart: gateway-helm
                  repo: docker.io/envoyproxy
                  version: v1.9.1
                  namespace: envoy-gateway-system

          - list:
              elements:
                - env: dev
                  cluster: https://dev-cluster.example.com
                  autoSync: true
                  prune: true
                - env: staging
                  cluster: https://staging-cluster.example.com
                  autoSync: true
                  prune: false
                - env: prod
                  cluster: https://prod-cluster.example.com
                  autoSync: false
                  prune: false

  template:
    metadata:
      name: '{{.component}}-{{.env}}'
      labels:
        component: '{{.component}}'
        environment: '{{.env}}'
        app.kubernetes.io/managed-by: argocd
    spec:
      project: platform

      # The first source is the upstream Helm chart. The second source is this
      # repository and is referenced as $values so chart configuration remains
      # reviewable and auditable in Git.
      sources:
        - repoURL: '{{.repo}}'
          chart: '{{.chart}}'
          targetRevision: '{{.version}}'
          helm:
            releaseName: '{{.release}}'
            valueFiles:
              - '$values/gitops-config/platform/values/{{.component}}/common.yaml'
              - '$values/gitops-config/platform/values/{{.component}}/{{.env}}.yaml'
            ignoreMissingValueFiles: true
        - repoURL: https://github.com/lloga29/goldenPath.git
          targetRevision: main
          ref: values

      destination:
        server: '{{.cluster}}'
        namespace: '{{.namespace}}'

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune }}
          selfHeal: true
    {{- end }}

# Argo CD project for shared platform components.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Shared platform and cluster infrastructure components

  # These repository URLs are reference placeholders and must be replaced when
  # the blueprint is adopted by a real organization.
  sourceRepos:
    - git@github.com:org/gitops-config.git
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-secrets
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  # The platform project intentionally spans multiple namespaces and clusters.
  # Production authorization must also be enforced through Argo CD RBAC and
  # protected Git environments.
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
    - namespace: '*'
      server: https://dev-cluster.example.com
    - namespace: '*'
      server: https://staging-cluster.example.com
    - namespace: '*'
      server: https://prod-cluster.example.com

  # Platform administrators require cluster-scoped capabilities for CRDs and
  # policy controllers. Application teams do not receive this project role.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  roles:
    - name: admin
      description: Platform administrators
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
      groups:
        - platform-team

    - name: readonly
      description: Read-only platform visibility
      policies:
        - p, proj:platform:readonly, applications, get, platform/*, allow
      groups:
        - developers

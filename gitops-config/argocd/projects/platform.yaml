# Proyecto Argo CD para componentes de plataforma
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Componentes de plataforma (infraestructura core)

  # Repositorios permitidos
  sourceRepos:
    - git@github.com:org/gitops-config.git
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-secrets
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  # Destinos permitidos
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
    - namespace: '*'
      server: https://dev-cluster.example.com
    - namespace: '*'
      server: https://staging-cluster.example.com
    - namespace: '*'
      server: https://prod-cluster.example.com

  # Recursos permitidos
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  # Roles del proyecto
  roles:
    - name: admin
      description: Administradores de plataforma
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
      groups:
        - platform-team

    - name: readonly
      description: Acceso de solo lectura
      policies:
        - p, proj:platform:readonly, applications, get, platform/*, allow
      groups:
        - developers

# Argo CD project for shared platform components.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Shared platform and cluster infrastructure components

  # Explicit allowlist. Do not replace with '*': chart and Git origins are part
  # of the platform supply-chain boundary.
  sourceRepos:
    - https://github.com/lloga29/goldenPath.git
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-policy-agent.github.io/gatekeeper/charts
    - docker.io/envoyproxy

  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
    - namespace: '*'
      server: https://dev-cluster.example.com
    - namespace: '*'
      server: https://staging-cluster.example.com
    - namespace: '*'
      server: https://prod-cluster.example.com

  # Platform administrators require cluster-scoped capabilities for CRDs,
  # GatewayClass, admission policy, and other cluster infrastructure. Team
  # applications use separate AppProjects with narrower authorization.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  roles:
    - name: admin
      description: Platform administrators
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
      groups:
        - platform-team

    - name: readonly
      description: Read-only platform visibility
      policies:
        - p, proj:platform:readonly, applications, get, platform/*, allow
      groups:
        - developers

apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: gatekeeper
  namespace: gatekeeper-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gatekeeper
      version: "3.14.0"  # Pinned version
      sourceRef:
        kind: HelmRepository
        name: gatekeeper
        namespace: flux-system
  values:
    replicas: 2
    auditInterval: 60
    constraintViolationsLimit: 20
    auditFromCache: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Governed policy exception registry.
#
# CI compiles this registry into Conftest data only after fail-closed validation.
# Gatekeeper intentionally remains strict and does not consume this registry.
version: 1

enforcement:
  conftest: scoped-exceptions
  gatekeeper: strict

exceptions: []


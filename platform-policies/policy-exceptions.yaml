#     created: "2026-09-16"
#     expires: "2026-10-01"

# Admission/system namespaces that may require separate platform policies.
# This list is reference data until issue #14 integrates exception data with
# enforcement. It must not be interpreted as an automatic bypass today.
excluded_namespaces:
  - kube-system
  - kube-public
  - gatekeeper-system

# Governed policy exception registry.
#
# This file is validated for structure and expiry, but it does NOT currently
# bypass Conftest or Gatekeeper decisions. Active exception enforcement is
# tracked in repository issue #14 to avoid introducing an implicit bypass.
version: 1

exceptions: []

# Example only; keep examples commented so no exception is accidentally active.
# exceptions:

# Excepciones de Políticas
# Cada excepción debe tener:
# - Justificación técnica
# - Owner responsable
# - Fecha de expiración
# - Issue de seguimiento

exceptions:
  # Ejemplo de excepción
  # - policy: no_latest_tag
  #   resource: deployment/legacy-app
  #   namespace: legacy-system
  #   reason: "App legacy que requiere migración. Tracking: JIRA-1234"
  #   owner: "team-legacy@company.com"
  #   expires: "2024-06-01"
  #   approved_by: "security-team"

  # Excepción temporal para migraciones
  # - policy: required_resources
  #   resource: deployment/migration-job
  #   namespace: migrations
  #   reason: "Job de migración temporal con recursos variables"
  #   owner: "platform@company.com"
  #   expires: "2024-03-01"

# Políticas deshabilitadas globalmente (usar con extrema precaución)
disabled_policies: []

# Namespaces excluidos de políticas (solo sistema)
excluded_namespaces:
  - kube-system
  - kube-public
  - gatekeeper-system

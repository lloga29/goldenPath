apiVersion: apps/v1
kind: Deployment
metadata:
  name: invalid-api
  labels:
    app.kubernetes.io/name: invalid-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: invalid-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invalid-api
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: ghcr.io/example/invalid-api:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true

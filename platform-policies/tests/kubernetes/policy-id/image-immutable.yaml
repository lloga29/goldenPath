apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-policy-negative
  labels:
    app.kubernetes.io/name: image-policy-negative
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: policy-fixtures
    app.kubernetes.io/managed-by: argocd
    team: platform
    environment: dev
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: image-policy-negative
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-policy-negative
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: policy-fixtures
        app.kubernetes.io/managed-by: argocd
        team: platform
        environment: dev
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/example/policy-fixture:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080

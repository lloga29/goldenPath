apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api
  namespace: legacy-system
  labels:
    app.kubernetes.io/name: legacy-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: example
    app.kubernetes.io/managed-by: argocd
    environment: dev
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: legacy-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: example
        app.kubernetes.io/managed-by: argocd
        environment: dev
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/example/legacy-api:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080

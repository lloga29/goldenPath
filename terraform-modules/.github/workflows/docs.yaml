# Documentation validation blueprint for a standalone Terraform modules repository.
# It deliberately does not create bot-authored commits.

name: Validate Generated Docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/**/*.tf'
      - 'patterns/**/*.tf'
      - 'scripts/generate-docs.sh'
      - '.terraform-docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.17.0/terraform-docs-v0.17.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: Generate documentation
        run: ./scripts/generate-docs.sh

      - name: Verify documentation is committed
        run: |
          if ! git diff --exit-code; then
            echo "Generated documentation is stale. Regenerate it locally and commit the changes as Juan Gallo <lloga29@gmail.com>."
            exit 1
          fi

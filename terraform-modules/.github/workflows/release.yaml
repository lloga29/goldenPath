# Release blueprint for a standalone Terraform modules repository.
# Releases are published from an existing, human-authored version tag and this workflow creates no commits.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify semantic version tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH. Received: $TAG"
            exit 1
          fi

          if [ -f VERSION ]; then
            VERSION=$(tr -d '[:space:]' < VERSION)
            if [ "v$VERSION" != "$TAG" ]; then
              echo "VERSION ($VERSION) does not match release tag ($TAG)."
              exit 1
            fi
          fi

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..${GITHUB_REF_NAME}" > release-notes.md
          else
            git log --pretty=format:'- %s (%h)' "${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false

# CI blueprint for a standalone Terraform modules repository.
# In the consolidated goldenPath repository this nested workflow is documentation/reference only.

name: Terraform Modules CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: terraform-modules-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.6.0"
  TFLINT_VERSION: "v0.50.0"

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main..HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
          fi

          MODULES=$(echo "$CHANGED_FILES" | \
            grep -E "^modules/" | \
            cut -d'/' -f1-3 | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "has_changes=$([ "$MODULES" != "[]" ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
          echo "Detected modules: $MODULES"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform format check
        run: terraform fmt -check -recursive -diff

  lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Initialize TFLint
        run: tflint --init
        working-directory: ${{ matrix.module }}
      - name: Run TFLint
        run: tflint --recursive
        working-directory: ${{ matrix.module }}

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.module }}
      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ matrix.module }}

  security:
    needs: [detect-changes, validate]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.module }}
          framework: terraform
          soft_fail: false
          skip_check: CKV_TF_1
      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.module }}
          soft_fail: false

  test:
    needs: [detect-changes, security]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.module }}
      - name: Run Terraform tests
        run: |
          if [ -d tests ]; then
            terraform test
          else
            echo "No tests directory found; skipping Terraform-native tests."
          fi
        working-directory: ${{ matrix.module }}

  docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.17.0/terraform-docs-v0.17.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/
      - name: Verify generated documentation
        run: |
          ./scripts/generate-docs.sh
          git diff --exit-code || {
            echo "Generated documentation is stale. Run ./scripts/generate-docs.sh and commit the result as the repository author."
            exit 1
          }

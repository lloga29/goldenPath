# terraform-docs configuration for reusable modules.

formatter: markdown table
version: "0.17"

header-from: docs/header.md
footer-from: docs/footer.md

recursive:
  enabled: true
  path: modules

sections:
  hide: []
  show: []

content: |-
  {{ .Header }}

  ## Usage

  ```hcl
  module "{{ .Module.Name }}" {
    source = "git::https://github.com/example/platform-terraform-modules.git//{{ .Module.Source }}?ref=vX.X.X"

    # Required inputs.
    {{- range .Module.Inputs }}
    {{- if .Required }}
    {{ .Name }} = {{ if eq .Type "string" }}"value"{{ else if eq .Type "bool" }}true{{ else if eq .Type "number" }}1{{ else }}{}{{ end }}
    {{- end }}
    {{- end }}
  }
  ```

  {{ .Requirements }}

  {{ .Providers }}

  {{ .Modules }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

  {{ .Footer }}

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

output-values:
  enabled: false

sort:
  enabled: true
  by: required

settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true

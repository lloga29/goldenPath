name: Publish GoldenPath v0.2.0

on:
  workflow_run:
    workflows: ["Runtime Lab"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      RELEASE: v0.2.0
      TARGET: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate publication request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("docs/releases/v0.2.0-publish-request.json").read_text(encoding="utf-8")
          )
          expected = {
              "schemaVersion": "goldenpath.release-publish-request/v2",
              "release": "v0.2.0",
              "publishWhen": "successful-runtime-lab-on-main",
              "productionValidation": "NOT_CLAIMED",
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f"invalid release request {key}: {data.get(key)!r}")
          PY

      - name: Check existing publication state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE already exists; publication workflow is a no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact successful main Runtime Lab
        id: qualification
        if: steps.state.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$RUN_BRANCH" == "main" ]] || {
            echo "ERROR: Runtime Lab branch is $RUN_BRANCH, expected main" >&2
            exit 1
          }
          [[ "$RUN_EVENT" == "push" ]] || {
            echo "ERROR: Runtime Lab event is $RUN_EVENT, expected push" >&2
            exit 1
          }

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$TARGET" ]] || {
            echo "ERROR: Runtime Lab target $TARGET is not current main $current_main" >&2
            exit 1
          }

          run_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')"
          run_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion')"
          run_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.name')"
          [[ "$run_head" == "$TARGET" ]] || {
            echo "ERROR: qualification run head $run_head does not match $TARGET" >&2
            exit 1
          }
          [[ "$run_conclusion" == "success" ]] || {
            echo "ERROR: qualification run conclusion is $run_conclusion" >&2
            exit 1
          }
          [[ "$run_name" == "Runtime Lab" ]] || {
            echo "ERROR: qualification run is not Runtime Lab: $run_name" >&2
            exit 1
          }

          prefix="goldenpath-v0.2.0-candidate-evidence-${RUN_ID}-"
          artifact="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts"               --jq ".artifacts[] | select(.expired == false) | select(.name | startswith(\"${prefix}\")) | .name"               | head -n 1
          )"
          [[ -n "$artifact" ]] || {
            echo "ERROR: release-candidate qualification artifact is missing or expired" >&2
            exit 1
          }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Publish immutable v0.2.0 GitHub Release
        if: steps.state.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.qualification.outputs.artifact }}
        run: |
          set -euo pipefail

          {
            cat docs/releases/v0.2.0.md
            printf '\n## Exact release qualification\n\n'
            printf -- '- Release commit: `%s`\n' "$TARGET"
            printf -- '- Runtime Lab qualification run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$RUN_ID"
            printf -- '- Qualification artifact: `%s`\n' "$ARTIFACT"
            printf -- '- Production validation: **NOT CLAIMED**\n'
          } > /tmp/release-notes.md

          gh release create "$RELEASE"             --target "$TARGET"             --title "GoldenPath v0.2.0 — Runtime Evidence & Autonomous Assurance"             --notes-file /tmp/release-notes.md             --latest

      - name: Verify published release identity
        if: steps.state.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE}" --jq '.object.sha')"
          release_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE}" --jq '.tag_name')"
          release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE}" --jq '.target_commitish')"
          release_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE}" --jq '.html_url')"
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"

          [[ "$tag_sha" == "$TARGET" ]] || {
            echo "ERROR: published tag points to $tag_sha, expected $TARGET" >&2
            exit 1
          }
          [[ "$release_tag" == "$RELEASE" ]] || {
            echo "ERROR: release tag is $release_tag, expected $RELEASE" >&2
            exit 1
          }
          [[ "$release_target" == "$TARGET" ]] || {
            echo "ERROR: release target is $release_target, expected $TARGET" >&2
            exit 1
          }
          [[ "$latest_tag" == "$RELEASE" ]] || {
            echo "ERROR: latest release is $latest_tag, expected $RELEASE" >&2
            exit 1
          }

          printf 'Verified release %s\n' "$release_url"
          printf 'Tag: %s\nTarget: %s\nLatest: %s\n' "$release_tag" "$release_target" "$latest_tag"

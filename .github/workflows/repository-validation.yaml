name: Repository validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.domains.outputs.docs }}
      terraform: ${{ steps.domains.outputs.terraform }}
      gitops: ${{ steps.domains.outputs.gitops }}
      policies: ${{ steps.domains.outputs.policies }}
      templates: ${{ steps.domains.outputs.templates }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed validation domains
        id: domains
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/detect-ci-domains.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Validate active CI supply-chain contract
        run: python3 scripts/validate-ci-supply-chain.py

      - name: Install structured-file parser
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-structured.lock

      - name: Enforce English-only content
        run: python3 scripts/check-english-only.py

      - name: Validate YAML and JSON syntax
        run: python3 scripts/check-structured-files.py

      - name: Validate evidence contract fail-closed semantics
        run: python3 scripts/test-evidence-contract.py

      - name: Validate R0-R4 risk-adaptive assurance semantics
        run: python3 scripts/test-risk-adaptive-assurance.py

      - name: Run zero-cloud public demo
        run: ./scripts/demo.sh

      - name: Build and validate static Pages site
        run: ./scripts/build-pages-site.sh

      - name: Validate CI domain routing semantics
        run: python3 scripts/test-ci-domain-routing.py

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

  security-history:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: '8.30.0'
      GITLEAKS_LINUX_X64_SHA256: '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Prove detector fails closed on a canary secret
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$(mktemp -d)"
          trap 'rm -rf "$canary_dir"' EXIT
          printf 'api_key = "%s%s"\n' '8dyfuiRyq=vVc3RRr_' 'edRk-fK__JItpZ' > "$canary_dir/canary.txt"

          set +e
          gitleaks dir --no-banner --redact "$canary_dir"
          status=$?
          set -e

          if [[ "$status" -ne 1 ]]; then
            echo "ERROR: Gitleaks canary was not detected; refusing to trust a silent secret scan." >&2
            exit 1
          fi

      - name: Scan complete reachable Git history for secrets
        run: gitleaks git --verbose --no-banner --redact --log-opts="--all" .

  documentation:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local Markdown links
        run: python3 scripts/check-markdown-links.py

      - name: Render Mermaid diagrams
        run: python3 scripts/validate-mermaid-rendering.py

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.2'
          terraform_wrapper: false

      - name: Validate Terraform modules and tests
        run: ./terraform-modules/scripts/validate-all.sh

      - name: Validate executable platform stacks
        run: ./scripts/validate-platform-stacks.sh

  gitops-policy:
    needs: changes
    if: needs.changes.outputs.gitops == 'true' || needs.changes.outputs.policies == 'true'
    runs-on: ubuntu-24.04
    env:
      KUSTOMIZE_VERSION: '5.8.1'
      KUSTOMIZE_LINUX_AMD64_SHA256: '029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d'
      CONFTEST_VERSION: '0.70.0'
      CONFTEST_LINUX_X86_64_SHA256: 'e738506fd808f7dc9794ce8e325f89b14932891a4841fe45f1f24c4a9bb3ed96'
      HELM_VERSION: '4.3.0'
      HELM_LINUX_AMD64_SHA256: '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install policy dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-structured.lock

      - name: Validate Argo CD platform contract
        run: python3 scripts/validate-gitops-contract.py

      - name: Install Kustomize
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_LINUX_AMD64_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

      - name: Build GitOps Kustomize targets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            echo "Building $dir"
            kustomize build "$dir" >/dev/null
          done < <(find gitops-config/apps gitops-config/platform gitops-config/policies -name kustomization.yaml -exec dirname {} \; | sort -u)

      - name: Validate digest-bound promotion contract
        run: ./gitops-config/scripts/test-promotion-contract.sh

      - name: Install pinned Helm
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_LINUX_AMD64_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Render platform Helm add-ons
        run: ./scripts/validate-platform-helm.sh

      - name: Install Conftest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_LINUX_X86_64_SHA256}  conftest.tar.gz" | sha256sum -c -
          tar -xzf conftest.tar.gz
          sudo install -m 0755 conftest /usr/local/bin/conftest

      - name: Run policy fixtures
        run: ./platform-policies/scripts/test-policies.sh

      - name: Validate policy exception registry
        run: python3 platform-policies/scripts/validate-exceptions.py platform-policies/policy-exceptions.yaml

  service-template:
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false

      - name: Install hash-locked Copier toolchain
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-template.lock

      - name: Render and validate Go paved-road template
        run: ./service-templates/scripts/render-go-template-smoke-test.sh

  repository-gate:
    name: Repository validation gate
    needs:
      - changes
      - baseline
      - security-history
      - documentation
      - terraform
      - gitops-policy
      - service-template
    if: always()
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      BASELINE_RESULT: ${{ needs.baseline.result }}
      SECURITY_HISTORY_RESULT: ${{ needs.security-history.result }}
      DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
      TERRAFORM_RESULT: ${{ needs.terraform.result }}
      GITOPS_POLICY_RESULT: ${{ needs.gitops-policy.result }}
      SERVICE_TEMPLATE_RESULT: ${{ needs.service-template.result }}
    steps:
      - name: Require every applicable validation domain
        shell: bash
        run: |
          set -euo pipefail

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "ERROR: required job '$name' concluded '$result'." >&2
              exit 1
            fi
          }

          require_success_or_skipped() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "ERROR: applicable job '$name' concluded '$result'." >&2
                exit 1
                ;;
            esac
          }

          require_success "changes" "$CHANGES_RESULT"
          require_success "baseline" "$BASELINE_RESULT"
          require_success "security-history" "$SECURITY_HISTORY_RESULT"
          require_success_or_skipped "documentation" "$DOCUMENTATION_RESULT"
          require_success_or_skipped "terraform" "$TERRAFORM_RESULT"
          require_success_or_skipped "gitops-policy" "$GITOPS_POLICY_RESULT"
          require_success_or_skipped "service-template" "$SERVICE_TEMPLATE_RESULT"

          echo "All required and applicable repository validation domains passed."

name: Rebuild logo asset

on:
  push:
    branches:
      - fix/readme-logo-loki-pattern

permissions:
  contents: write

jobs:
  rebuild-logo:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/readme-logo-loki-pattern
          fetch-depth: 0

      - name: Rebuild PNG from staged payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .tmp/logo.part1.b64 > docs/assets/branding/goldenpath-logo.png
          python3 - <<'PY'
          from pathlib import Path
          import struct

          path = Path('docs/assets/branding/goldenpath-logo.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Invalid PNG signature')
          width, height, bit_depth, color_type = struct.unpack('>IIBB', data[16:26])
          if (width, height) != (420, 315):
              raise SystemExit(f'Unexpected dimensions: {width}x{height}')
          if bit_depth != 8 or color_type != 6:
              raise SystemExit(f'Expected 8-bit RGBA PNG, got bit_depth={bit_depth}, color_type={color_type}')
          print(f'Validated PNG: {width}x{height}, 8-bit RGBA, {len(data)} bytes')
          PY

      - name: Commit rebuilt asset when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/assets/branding/goldenpath-logo.png; then
            echo 'Logo asset already matches the validated PNG.'
            exit 0
          fi
          git config user.name 'Juan Gallo'
          git config user.email 'lloga29@gmail.com'
          git add docs/assets/branding/goldenpath-logo.png
          git commit -m 'fix: rebuild GoldenPath logo as validated RGBA PNG'
          git push origin HEAD:fix/readme-logo-loki-pattern

# Scheduled Terraform drift-detection blueprint.

name: Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      stack:
        description: 'Specific stack to check; leave empty to check all discovered stacks.'
        required: false
        default: ''

env:
  TF_VERSION: "1.6.0"
  TF_IN_AUTOMATION: "true"

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  list-stacks:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.list.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
      - name: List stacks
        id: list
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.stack }}" ]; then
            STACKS='["${{ github.event.inputs.stack }}"]'
          else
            STACKS=$(find clients teams -name main.tf -exec dirname {} \; 2>/dev/null | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "stacks=$STACKS" >> "$GITHUB_OUTPUT"

  detect-drift:
    needs: list-stacks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: { stack: "${{ fromJson(needs.list-stacks.outputs.stacks) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_ARN }}", aws-region: us-east-1 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - run: terraform init -input=false
        working-directory: ${{ matrix.stack }}
      - name: Terraform drift plan
        id: plan
        shell: bash
        working-directory: ${{ matrix.stack }}
        run: |
          set +e
          set -o pipefail
          terraform plan -detailed-exitcode -no-color 2>&1 | tee plan.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          case "$EXIT_CODE" in
            0) echo "drift_detected=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "drift_detected=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Terraform plan failed for ${{ matrix.stack }}"; exit "$EXIT_CODE" ;;
          esac
      - name: Create or update drift issue
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.stack }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '...' : plan;
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, labels: 'drift,infrastructure', state: 'open'});
            const existing = issues.data.find(i => i.title.includes('${{ matrix.stack }}'));
            const body = `## Drift detected in \`${{ matrix.stack }}\`\n\nTerraform reports a difference between declared and observed infrastructure.\n\n<details><summary>Terraform plan</summary>\n\n\`\`\`terraform\n${truncated}\n\`\`\`\n</details>\n\n### Required actions\n1. Review the changes and relevant cloud audit logs.\n2. Determine whether the runtime change was authorized.\n3. If accepted, update/import the declared configuration through review.\n4. If unauthorized, use the approved apply path to restore declared state.\n\nSee the infrastructure-drift runbook in the platform documentation.`;
            if (existing) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: `Infrastructure drift: ${{ matrix.stack }}`, body, labels: ['drift','infrastructure','automated']});

  summary:
    needs: detect-drift
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Drift detection summary
        run: |
          echo "Drift detection completed at $(date -u +%FT%TZ)."
          echo "Review open drift issues and any failed plan jobs."

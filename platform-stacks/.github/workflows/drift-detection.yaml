# Drift Detection Pipeline
# Detecta diferencias entre el estado y la realidad

name: Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'  # Diariamente a las 6 AM UTC
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack específico a verificar (vacío = todos)'
        required: false
        default: ''

env:
  TF_VERSION: "1.6.0"
  TF_IN_AUTOMATION: "true"

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  # ============================================
  # LISTAR STACKS
  # ============================================
  list-stacks:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.list.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4

      - name: Listar stacks
        id: list
        run: |
          if [ -n "${{ github.event.inputs.stack }}" ]; then
            STACKS='["${{ github.event.inputs.stack }}"]'
          else
            # Encontrar todos los stacks con main.tf
            STACKS=$(find clients teams -name "main.tf" -exec dirname {} \; 2>/dev/null | \
              sort -u | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "stacks=$STACKS" >> $GITHUB_OUTPUT

  # ============================================
  # DETECTAR DRIFT
  # ============================================
  detect-drift:
    needs: list-stacks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: ${{ fromJson(needs.list-stacks.outputs.stacks) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ matrix.stack }}

      - name: Terraform Plan (Drift Check)
        id: plan
        run: |
          terraform plan -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # Exit code 2 = changes detected (drift)
          if [ $EXIT_CODE -eq 2 ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ matrix.stack }}
        continue-on-error: true

      - name: Create Issue on Drift
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.stack }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '...' : plan;

            // Buscar issue existente
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['drift', 'infrastructure'],
              state: 'open'
            });

            const existingIssue = issues.data.find(i =>
              i.title.includes('${{ matrix.stack }}')
            );

            const body = `## Drift detectado en \`${{ matrix.stack }}\`

            Se detectaron diferencias entre el estado de Terraform y la infraestructura real.

            ### Plan de Terraform

            <details>
            <summary>Ver cambios detectados</summary>

            \`\`\`
            ${truncated}
            \`\`\`

            </details>

            ### Acciones Requeridas

            1. Revisar los cambios detectados
            2. Determinar si fueron cambios manuales autorizados
            3. Si son válidos: importar al estado con \`terraform import\`
            4. Si no son válidos: aplicar \`terraform apply\` para revertir

            ### Runbook

            Ver [Runbook: Drift Detectado](../docs/runbooks/drift-detected.md)

            ---
            *Detectado automáticamente por Drift Detection*`;

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔄 Drift detectado: ${{ matrix.stack }}`,
                body: body,
                labels: ['drift', 'infrastructure', 'automated']
              });
            }

  # ============================================
  # RESUMEN
  # ============================================
  summary:
    needs: detect-drift
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Resumen de Drift Detection
        run: |
          echo "=== Drift Detection Completado ==="
          echo "Fecha: $(date)"
          echo "Ver issues creados para stacks con drift"
